[project]
readme = "README.md"
name = "elims-utils"
version = "1.0.1"
description = "Shared utility functions for ELIMS packages."
license = "MIT"
requires-python = ">=3.13"

[project.urls]
Documentation = "https://fabienmeyer.github.io/elims/"
Repository = "https://github.com/FabienMeyer/elims"
Issues = "https://github.com/FabienMeyer/elims/issues"

[project.optional-dependencies]
dev = ["mypy>=1.19", "pytest>=9", "pytest-cov>=7", "ruff>=0.14"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=1.0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elims_utils"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
