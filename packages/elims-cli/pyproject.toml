[project]
readme = "README.md"
name = "elims-cli"
version = "1.0.1"
description = "Minimal Typer application shell for ELIMS."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["typer>=0.29.2"]

[project.urls]
Documentation = "https://fabienmeyer.github.io/elims/"
Repository = "https://github.com/FabienMeyer/elims"
Issues = "https://github.com/FabienMeyer/elims/issues"

[project.scripts]
elims = "elims_cli.app:main"

[dependency-groups]
dev = ["mypy>=1.19", "pytest>=9", "pytest-cov>=7", "ruff>=0.14"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=1.0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elims_cli"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
