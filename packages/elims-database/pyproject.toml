[project]
readme = "README.md"
name = "elims-database"
version = "1.0.1"
description = "Reusable asynchronous SQLModel database infrastructure."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["sqlalchemy[asyncio]>=2.1.9", "sqlmodel>=0.0.50"]

[project.urls]
Documentation = "https://fabienmeyer.github.io/elims/"
Repository = "https://github.com/FabienMeyer/elims"
Issues = "https://github.com/FabienMeyer/elims/issues"

[dependency-groups]
dev = ["aiosqlite>=0.20", "mypy>=1.19", "pytest>=9", "pytest-asyncio>=1.3", "pytest-cov>=7", "ruff>=0.14"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=1.0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elims_database"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
