[project]
readme = "README.md"
name = "elims-database"
version = "0.1.0"
description = "Reusable asynchronous SQLModel database infrastructure."
requires-python = ">=3.13"
dependencies = ["sqlalchemy[asyncio]>=2.0", "sqlmodel>=0.0.24"]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "mypy>=1.19", "pytest>=9", "pytest-asyncio>=1.3", "pytest-cov>=7", "ruff>=0.14"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elims_database"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
