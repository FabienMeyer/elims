x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-root-me}
    volumes: [mariadb-data:/var/lib/mysql]
    logging: *logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://app:change-me@mariadb:3306/app}
    depends_on:
      mariadb: { condition: service_healthy }
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://app:change-me@mariadb:3306/app}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    logging: *logging
    healthcheck:
      # Nginx listens on IPv4 only; busybox wget may try ::1 for localhost.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:9090:9090"]
    logging: *logging

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports: ["127.0.0.1:3000:3000"]
    logging: *logging

volumes:
  mariadb-data:
  prometheus-data:
  grafana-data:
