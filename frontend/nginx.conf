# Vite fingerprints everything under /assets/, so those files never change.
# The application shell must be revalidated so a deploy is picked up at once.
# API responses keep whatever caching the backend decides.
map $uri $frontend_cache_control {
  ~^/api/    "";
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  # vite.config.ts reads this policy so end-to-end tests run under it.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  # Without "always": success and redirect responses only, never errors.
  add_header Cache-Control $frontend_cache_control;
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
