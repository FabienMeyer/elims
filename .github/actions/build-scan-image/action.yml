name: Build and scan release candidate
description: Build the attested linux/amd64 OCI archive and scan its runnable image
inputs:
  context:
    description: Docker build context
    required: true
  dockerfile:
    description: Dockerfile path from the repository root
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build candidate with attestations
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        sbom: true
        provenance: mode=max
        outputs: type=oci,dest=${{ runner.temp }}/candidate.tar
    - name: Extract runnable image for scanning
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y skopeo
        skopeo --override-os linux --override-arch amd64 copy \
          "oci-archive:$RUNNER_TEMP/candidate.tar" "docker-archive:$RUNNER_TEMP/scan.tar"
    - name: Scan candidate image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        version: v0.76.2
        input: ${{ runner.temp }}/scan.tar
        severity: HIGH,CRITICAL
        exit-code: "1"
