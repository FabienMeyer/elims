name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release-pr-lockfile:
    # Release Please bumps the workspace versions but cannot update uv.lock, so
    # regenerate it on the open release pull request after each update.
    needs: release
    if: needs.release.outputs.created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-pr-lockfile
      cancel-in-progress: true
    steps:
      - name: Find the open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr list --state open --base main --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - if: steps.pr.outputs.branch != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: { version: "0.13.7" }
      - name: Commit the regenerated lockfile to the release pull request
        if: steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the release versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore(release): regenerate uv.lock" -- uv.lock
          git push origin "HEAD:$BRANCH"

  images:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      release-sha: ${{ needs.release.outputs.sha }}
      release-tag: ${{ needs.release.outputs.tag }}

  build-python:
    needs: [release, images]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: { version: "0.13.7" }
      - name: Build public Python distributions
        run: |
          for package in elims-cli elims-com elims-database elims-instruments elims-utils; do
            uv build --package "$package" --out-dir "dist/$package"
          done
      - run: uv run --locked python scripts/check_wheels.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [elims-cli, elims-com, elims-database, elims-instruments, elims-utils]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/${{ matrix.package }}/
