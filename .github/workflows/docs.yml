name: Documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: uv sync --locked --all-packages --all-extras --group docs
      - name: Validate standalone package documentation
        run: |
          for component in backend frontend; do
            (cd "$component" && uv run mkdocs build --strict)
          done
          for package in packages/*; do
            if [ -f "$package/mkdocs.yml" ]; then
              (cd "$package" && uv run mkdocs build --strict)
            fi
          done
      - run: uv run --locked mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: site }
  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
