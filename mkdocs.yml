          - Overview: packages/elims-instruments/index.md
          - Vision: packages/elims-instruments/product/vision.md
          - Architecture: packages/elims-instruments/architecture.md
          - Specifications: packages/elims-instruments/specifications/index.md
          - Decisions: packages/elims-instruments/decisions/index.md
          - Usage: packages/elims-instruments/usage.md
          - API: packages/elims-instruments/api.md
          - Changelog: packages/elims-instruments/changelog.md
