          - Decisions: packages/elims-com/decisions/index.md
          - Usage: packages/elims-com/usage.md
          - API: packages/elims-com/api.md
          - Changelog: packages/elims-com/changelog.md
      - elims-database:
          - Overview: packages/elims-database/index.md
          - Vision: packages/elims-database/product/vision.md
          - Architecture: packages/elims-database/architecture.md
