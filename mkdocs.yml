      - Authentication: operations/authentication.md
      - Observability: operations/observability.md
  - Contributing:
      - Issues and branches: contributing/issues-and-branches.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
