site_name: ELIMS
hooks: [docs/hooks.py]
theme:
  name: material
nav:
  - Home: index.md
  - Product:
      - Vision: product/vision.md
      - Principles: product/principles.md
      - Roadmap: product/roadmap.md
  - Specifications:
      - Overview: specifications/index.md
  - Decisions:
      - Overview: decisions/index.md
  - Agents:
      - Idea Shaper: agents/idea-shaper.md
  - Architecture:
      - Overview: architecture.md
      - Components: components/index.md
  - Backend:
      - Overview: components/backend/index.md
      - Vision: components/backend/product/vision.md
      - Architecture: components/backend/architecture.md
      - Specifications: components/backend/specifications/index.md
      - Decisions: components/backend/decisions/index.md
      - API: components/backend/api.md
      - Database: components/backend/database.md
