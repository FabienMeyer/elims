[project]
name = "template-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "aiomysql>=0.2",
  "alembic>=1.14",
  "elims-database",
  "fastapi>=0.115",
  "prometheus-fastapi-instrumentator>=8.1,<9",
  "pydantic-settings>=2.7",
  "pymysql>=1.1",
  "sqlalchemy[asyncio]>=2.0",
  "sqlmodel>=0.0.24",
  "structlog>=25.5,<27",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "httpx>=0.28", "mypy>=1.19", "pytest>=9", "pytest-asyncio>=1.3", "pytest-cov>=7", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
