[tool.uv.workspace]
members = [
  "backend",
  "packages/elims-cli",
  "packages/elims-utils",
  "packages/elims-com",
  "packages/elims-database",
  "packages/elims-instruments",
]

[tool.uv.sources]
elims-cli = { workspace = true }
elims-utils = { workspace = true }
elims-com = { workspace = true }
elims-database = { workspace = true }
elims-instruments = { workspace = true }

[dependency-groups]
dev = ["mypy>=1.19", "pytest>=9", "pytest-cov>=7", "ruff>=0.14"]
quality = ["griffe>=2.4.1", "pre-commit>=4", "pyyaml>=6", "yamllint>=1.35"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=1.0.8"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "packages", ".claude/skills"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app", "elims_cli", "elims_com", "elims_database", "elims_instruments", "elims_utils"]
omit = ["*/alembic/*", "*/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]
